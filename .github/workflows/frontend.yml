name: Frontend checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:build
      # The e2e suite drives the real app against the local backend (SQL Server plus the API),
      # which this job does not start, so it stays opt-in: set the repository variable PF_E2E=true
      # in a runner that has a backend, or run pnpm e2e locally after 打开PersonalFinance.bat.
      - run: pnpm exec playwright install --with-deps chromium
        if: vars.PF_E2E == 'true'
      - run: pnpm e2e
        if: vars.PF_E2E == 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
